[environment]
variables = ".jreleaser.properties"

[signing]
active = "ALWAYS"

[signing.pgp]
armored = true
mode = "FILE"
publicKey = ".jreleaser-gpg-public.pgp"
secretKey = ".jreleaser-gpg-secret.pgp"

[deploy.maven.mavenCentral.release-deploy]
active = "RELEASE"
url = "https://central.sonatype.com/api/v1/publisher"
stagingRepositories = ["target/staging-deploy"]
applyMavenCentralRules = true

[release.github]
owner = "OpenElementsLabs"
name = "spring-services"
changelog.formatted = "ALWAYS"
changelog.preset = "conventional-commits"
