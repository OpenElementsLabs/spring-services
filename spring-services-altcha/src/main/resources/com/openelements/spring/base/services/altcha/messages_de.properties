# Meldungen für Besucher, wenn die ALTCHA-Prüfung fehlschlägt (Deutsch). Schlüssel: das Prüfergebnis.
missing=Die Prüfung gegen automatisierte Anfragen fehlt. Bitte warten Sie, bis das Häkchen „Ich bin kein Roboter“ gesetzt ist, und senden Sie das Formular erneut.
expired=Die Prüfung gegen automatisierte Anfragen ist abgelaufen. Bitte laden Sie die Seite neu und senden Sie das Formular erneut.
reused=Diese Prüfung gegen automatisierte Anfragen wurde schon verwendet. Bitte laden Sie die Seite neu und senden Sie das Formular erneut.
invalid=Die Prüfung gegen automatisierte Anfragen ist ungültig. Bitte laden Sie die Seite neu und senden Sie das Formular erneut.
