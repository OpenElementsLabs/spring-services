# Messages for visitors when the ALTCHA bot check fails (English, default). Keys: the verification result.
missing=The check against automated requests is missing. Please wait until the box "I'm not a robot" is ticked and send the form again.
expired=The check against automated requests has expired. Please reload the page and send the form again.
reused=This check against automated requests has already been used. Please reload the page and send the form again.
invalid=The check against automated requests is invalid. Please reload the page and send the form again.
